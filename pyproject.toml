[project]
name = "spotify-mcp"
version = "0.1.0"
description = "Lean, 100% Python MCP server for the 2026 Spotify Web API"
readme = "PRODUCT_IMPLEMENTATION_PLAN.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2,<3",
    "httpx>=0.27",
]

[project.scripts]
spotify-mcp = "spotify_mcp.server:main"
spotify-mcp-auth = "spotify_mcp.auth:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotify_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
